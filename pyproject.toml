[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sohml"
version = "0.1.0"
description = "Window-Adaptive Multi-Objective Metaheuristic Co-Optimization for Partial-Charging Battery SOH Regression"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "pyarrow>=12.0.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "pymoo>=0.6.1",
    "optuna>=3.4.0",
    "shap>=0.43.0",
    "numba>=0.58.0",
    "h5py>=3.9.0",
    "pyyaml>=6.0.1",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.9.0",
    "ruff>=0.1.0",
    "ipykernel>=6.25.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
